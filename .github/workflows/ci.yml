name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Weekly, for advisories published since the last push, and against Rawhide, for what
  # the next Fedora's toolchain will break.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test${{ matrix.fedora != '44' && format(' on Fedora {0}', matrix.fedora) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ github.event_name == 'schedule' && fromJSON('["44", "rawhide"]') || fromJSON('["44"]') }}
    # The toolchain the COPR RPMs are built with.
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    steps:
      - name: Install the build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git-core rust cargo rustfmt clippy just
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint
        run: just check
      - name: Test
        run: just test

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: daemon/Cargo.toml

  release:
    name: Release
    needs: [check, deny]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write

  aur:
    name: AUR
    # After the release, whose job also checks that the tag matches the sources.
    needs: release
    uses: ./.github/workflows/aur.yml
    # A called workflow sees no secrets, its environment's included, unless the
    # caller passes them on.
    secrets: inherit
